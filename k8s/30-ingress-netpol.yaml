apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments-ingress
  namespace: payments
  annotations:
    nginx.ingress.kubernetes.io/rate-limit-rps: "200"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["payments-api.example.com"]
      secretName: payments-api-tls
  rules:
    - host: payments-api.example.com
      http:
        paths:
          - path: /v1/payments
            pathType: Prefix
            backend:
              service: {name: api-gateway, port: {number: 80}}
---
# По умолчанию запрещаем весь трафик, затем разрешаем только нужное.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: payments
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway
  namespace: payments
spec:
  podSelector: {matchLabels: {app: api-gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]
      ports: [{port: 8080, protocol: TCP}]
  egress:
    - to: [{podSelector: {matchLabels: {app: postgres}}}]
      ports: [{port: 5432, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app: redis}}}]
      ports: [{port: 6379, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {strimzi.io/cluster: kafka}}}]
      ports: [{port: 9092, protocol: TCP}]
    - to: [] # DNS
      ports: [{port: 53, protocol: UDP}]

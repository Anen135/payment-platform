apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: payments
spec:
  replicas: 3
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      containers:
        - name: api-gateway
          image: registry.example.com/payments/api-gateway:latest
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: payments-config}
            - secretRef: {name: payments-secrets}
          resources:
            requests: {cpu: "200m", memory: "128Mi"}
            limits: {cpu: "1", memory: "512Mi"}
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: api-gateway}}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: payments
spec:
  selector: {app: api-gateway}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: payments
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api-gateway}
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: payments
spec:
  minAvailable: 2
  selector: {matchLabels: {app: api-gateway}}

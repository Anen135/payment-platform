apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: payments
spec:
  replicas: 2
  selector: {matchLabels: {app: ledger-service}}
  template:
    metadata: {labels: {app: ledger-service}}
    spec:
      containers:
        - name: ledger-service
          image: registry.example.com/payments/ledger-service:latest
          envFrom:
            - configMapRef: {name: payments-config}
            - secretRef: {name: payments-secrets}
          resources:
            requests: {cpu: "150m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: payments
spec:
  replicas: 2
  selector: {matchLabels: {app: notification-service}}
  template:
    metadata: {labels: {app: notification-service}}
    spec:
      containers:
        - name: notification-service
          image: registry.example.com/payments/notification-service:latest
          env:
            - name: WEBHOOK_URL
              value: ""
          envFrom:
            - configMapRef: {name: payments-config}
          resources:
            requests: {cpu: "100m", memory: "64Mi"}
            limits: {cpu: "300m", memory: "256Mi"}

# Рекомендация для production: Redis — через Bitnami Helm chart в режиме
# Cluster/Sentinel (для HA), Kafka — через Strimzi operator (см. ниже
# минимальный пример Kafka CR). Здесь — простой одиночный Redis для примера.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: payments
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1", memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: payments
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
# Пример Kafka-кластера через Strimzi operator (требует установленного
# strimzi-kafka-operator в кластере: helm install strimzi strimzi/strimzi-kafka-operator).
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka
  namespace: payments
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      num.partitions: 12
    storage:
      type: persistent-claim
      size: 100Gi
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 20Gi

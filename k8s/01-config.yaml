apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: payments
data:
  KAFKA_BROKERS: "kafka-bootstrap.payments.svc.cluster.local:9092"
  REDIS_ADDR: "redis.payments.svc.cluster.local:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-secrets
  namespace: payments
type: Opaque
stringData:
  DATABASE_URL: "postgres://payment:CHANGE_ME@postgres.payments.svc.cluster.local:5432/payments?sslmode=require"
